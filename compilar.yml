name: Compilar LuzCam
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -r windows/requirements.txt
      - name: Compilar EXE
        working-directory: windows
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name LuzCam --collect-all pyvirtualcam app.py
      - uses: actions/upload-artifact@v4
        with:
          name: LuzCam-Windows-prototipo
          path: |
            windows/dist/LuzCam/
            LICENSE
            README.md
            windows/*.py
            windows/requirements.txt
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de prueba y revisar lint
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LuzCam-Android-prototipo
          path: android/app/build/outputs/apk/debug/app-debug.apk
